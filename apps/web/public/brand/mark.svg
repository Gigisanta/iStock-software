<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="mark-title mark-description">
  <title id="mark-title">Marca iStock</title>
  <desc id="mark-description">Forma modular de tres tramos rectos que representa stock ordenado y en movimiento.</desc>
  <style>
