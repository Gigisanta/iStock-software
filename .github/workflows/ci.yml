name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mismo shim que scripts/pg-local.sh levanta en la maquina del dev: roles anon/authenticated/
  # service_role y un schema auth cuyo auth.jwt() tiene el MISMO cuerpo que el de Supabase.
  # Los tests de RLS cruzado NO se saltean en CI: si se saltearan, "A no lee B" seria una promesa.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/istock_dev
  ISTOCK_DB: istock_dev
  PGHOST: localhost
  PGUSER: postgres
  PGPASSWORD: postgres

jobs:
  build:
    name: typecheck · lint · test · rls
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.34.5 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Bloqueante por constitucion (CLAUDE.md §3): CVE-2026-64648 no tiene workaround, solo
      # upgrade, asi que una vulnerabilidad high o critical no entra a main.
      - name: audit
        run: pnpm audit --audit-level=high

      - name: typecheck
        run: pnpm -r typecheck

      - name: lint
        run: pnpm -r lint

      - name: base de datos
        run: ./scripts/pg-local.sh

      - name: migraciones
        run: pnpm --filter @istock/db migrate

      - name: seed
        run: pnpm --filter @istock/db seed

      - name: tests (incluye RLS cruzado contra Postgres real)
        run: pnpm -r test

      # Los gates que la constitucion pide y que ningun linter da gratis: si estos encuentran
      # algo, es una fuga a la vidriera, no un warning de estilo.
      #
      # Los cuatro corren SIEMPRE y por separado, no encadenados con `&&`: encadenarlos hace que
      # el primer rojo tape a los otros tres y que el reporte de CI diga una sola cosa cuando
      # pasaron cuatro. `if: always()` cuesta segundos y compra el diagnostico completo.
      # Los helpers compartidos de los gates, en las dos polaridades. Es la contrapartida de haber
      # centralizado en `scripts/_lib.sh` (T4): si un cambio aca rompiera `none()`/`noneraw()`, TODOS
      # los gates se volverian vacuamente verdes a la vez, que es el unico riesgo real de compartir.
      - name: polaridad de los helpers de los gates
        run: ./scripts/_lib.test.sh

      # Nace de un hallazgo del LEAD el 2026-08-28, y es el hermano del de arriba: si `_lib.sh`
      # protege de que TODOS los gates se vuelvan vacuamente verdes a la vez, este protege de que
      # UNO se vuelva vacuamente verde sin que nadie lo note. `accept-s1.sh` llamaba a `chk` diez
      # veces y a `have` una sin tenerlos importados —vivian sueltos adentro de `accept-fase3.sh`—
      # y bash resuelve eso imprimiendo por stderr, devolviendo 127 y siguiendo. `no()` nunca se
      # llama, asi que `fail` no se toca: el gate reporto 25 PASS / 1 FAIL con ONCE aserciones que
      # no corrieron, entre ellas las cuatro que le preguntan a Postgres si `anon` puede leer
      # `listings.imei` y si `listings` tiene RLS forzada. El unico FAIL era ajeno y falso: sin el,
      # el gate salia VERDE. No necesita base ni build, solo lee los scripts.
      - name: gate de los gates (ningun gate invoca un helper que no tiene)
        if: always()
        run: ./scripts/guard-gates.sh

      - name: polaridad del gate de los gates (se tiene que ver encender contra el arbol de ayer)
        if: always()
        run: ./scripts/guard-gates.test.sh

      - name: gate de datos sensibles
        run: ./scripts/guard-leaks.sh

      # Agregados por el LEAD el 2026-08-28. guard-grants existia desde el mismo dia pero SOLO
      # corria dentro de accept-s1.sh, que no esta en CI: o sea que la unica auditoria de los
      # GRANT del repo no se ejecutaba en ningun push. Un gate que no corre es un archivo.
      - name: gate de GRANT por sentencia (CLAUDE.md §2)
        if: always()
        run: ./scripts/guard-grants.sh

      - name: gate de R2 (master privado, key no derivable, cero delete por key)
        if: always()
        run: ./scripts/guard-r2.sh

      # Nace del adversary de S6 (2026-08-28). El dominio declara efectos obligatorios de transicion
      # y comenta que `apps/web` los ejecuta; cuatro de los cinco tenian CERO ejecutores, y uno de
      # esos cuatro —`closesReservation`— era un bug real: una unidad reservada se republicaba en la
      # vidriera como Disponible con la sena puesta. TypeScript no podia verlo (el parametro que se
      # olvidaron de pasar es opcional y su default es un valor valido), asi que el unico lugar
      # donde eso se ve es un gate. No necesita base ni build: solo lee dos arboles de fuentes.
      - name: gate de efectos declarados sin ejecutor
        if: always()
        run: ./scripts/guard-effects.sh

      # Tercer caso de la misma familia en un dia (guard-routes, guard-grants, y ahora este): un
      # gate que no esta en CI se pone rojo y nadie se entera. `accept-fase2.sh` estaba rojo desde
      # que S1 agrego las policies de la vidriera. Corre aca porque el job ya tiene Postgres
      # migrado y seedeado, que es todo lo que necesita — no necesita build.
      - name: aceptacion de FASE 2 (schema, RLS, policies, seed)
        if: always()
        run: ./scripts/accept-fase2.sh

      # Cuarto caso de la misma familia. El valor ENTERO del censo de rutas de guard-firewall es
      # "una ruta nueva rompe el gate el dia que se crea"; fuera de CI eso dependia de que alguien
      # se acordara de correrlo a mano, o sea de lo unico que el censo existe para no depender.
      # Lo marco `docs-keeper` cerrando T1, y por eso T1 quedo `done — nivel 1`.
      - name: gate de reglas de WAF (scoping + censo de rutas)
        if: always()
        run: ./scripts/guard-firewall.sh

      # Y su polaridad. Existe porque la frase "14 fixtures, 14 rompen" no era reejecutable: se
      # habia ejercido a mano y fuera del repo. El dia que se volvio un comando encontro que SEIS
      # reglas de F1 no fallaban nunca — las fixtures mutaban campos en la raiz de la regla y los
      # limites de Pro viven bajo `rateLimit`. Seis reglas verdes por vacio durante toda T1.
      # Hermano del de abajo, y por el mismo motivo. Va aca —job sin base, sin build— porque no
      # necesita ninguna de las dos: arma su propio arbol de fixtures en un temporal y le apunta
      # el linter con `WEB_LINT_ROOT`. Las 15 reglas se ven encender contra su ID, no contra el
      # exit code: 15 reglas sobre un mismo arbol hacen que un fixture pueda salir rojo por la
      # regla equivocada, y eso reportaria cobertura sin haber ejercido nada.
      - name: polaridad de web-lint (las 15 reglas se tienen que ver encender)
        if: always()
        run: ./scripts/web-lint.test.sh

      - name: polaridad del gate de WAF (cada regla se tiene que ver romper)
        if: always()
        run: ./scripts/guard-firewall.test.sh

      - name: phantom-file guard (artefacto inexistente o vacio = la tarea no paso)
        if: always()
        run: ./scripts/guard-artifacts.sh --harness

      # Va ultimo del job y hace su propio `next build`, que es lo que valida `cacheComponents` y
      # los `'use cache'`. Existia desde FASE 3 y no corria en ningun push: sexto gate de la misma
      # familia encontrado el 2026-08-28. Aca y no en `e2e` porque no depende del `.next` ajeno.
      - name: aceptacion de FASE 3 (build, cacheComponents, 'use cache')
        if: always()
        run: ./scripts/accept-fase3.sh

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/pg-local.sh && pnpm --filter @istock/db migrate && pnpm --filter @istock/db seed

      # `@istock/e2e`, NO `@istock/web`. La suite vive en `e2e/`, con su `playwright.config.ts` y su
      # devDependency de `@playwright/test`. `apps/web` no tiene ninguna de las dos cosas: hasta el
      # 2026-08-28 estas dos lineas decian `@istock/web` y el resultado era
      # `Total: 0 tests in 0 files`, exit 0. CI reportaba e2e verde sin haber corrido un solo test.
      - name: playwright
        run: pnpm --filter @istock/e2e exec playwright install --with-deps chromium

      # Los e2e que necesitan un secret humano (R2 real, MP sandbox, LLM) se marcan skip CON MOTIVO
      # en el propio test. Un e2e verde por no haber corrido es peor que un e2e rojo.
      - name: e2e
        run: pnpm --filter @istock/e2e e2e
        env:
          MEDIA_DRIVER: local
          BILLING_DRIVER: mock

      # El `.next` lo dejo el `webServer` del config de Playwright (buildea antes de levantar).
      # Este guard no buildea: lee ese manifest. Es el unico job que puede correrlo.
      - name: modo de servido de las rutas
        if: always()
        run: ./scripts/guard-routes.sh

      # ── Las aceptaciones por slice, que hasta hoy no corrian en ningun push ─────────────────
      # El 2026-08-28 aparecieron DOS gates rojos desde el mismo commit (`c9611b1`, S4):
      # `guard-routes` y `accept-fase2`. `accept-s4.sh` estuvo verde todo ese tiempo, y no por
      # error: una aceptacion por slice corre SUS aserciones, asi que estructuralmente no puede
      # ver el invariante que la slice derogo. Lo unico que cruza slices es esto.
      #
      # Van en el job de e2e y no en `build` porque tres de las cuatro necesitan un `.next`, y
      # aca ya existe: lo dejo el `webServer` de Playwright. Van DESPUES de `guard-routes`,
      # que lee ese mismo manifest — `accept-s2`/`accept-s3` levantan su propio `next start` y
      # pueden rebuildearlo. `accept-s1` ademas toca la base, y este job la tiene migrada.
      #
      # `if: always()`: si una falla quiero ver las otras tres, no la primera y nada mas.
      - name: aceptacion de S1 (vidriera por host, tenant nunca por header)
        if: always()
        run: ./scripts/accept-s1.sh

      - name: aceptacion de S2 (pipeline de fotos; card <=150KB medido)
        if: always()
        run: ./scripts/accept-s2.sh

      - name: aceptacion de S3 (ficha minima, 15 campos)
        if: always()
        run: ./scripts/accept-s3.sh

      - name: aceptacion de S4 (click de WA sin PII, con techo)
        if: always()
        run: ./scripts/accept-s4.sh

      # `accept-s6.sh` vuelve a correr SU spec, con la suite entera ya corrida dos pasos mas
      # arriba. No es redundancia: su V8 no mira el exit code de la suite, lee de la salida la
      # linea `MEDIDO s6 reserva` y le exige seis campos. Grepeaba el FUENTE hasta hoy, y por eso
      # no podia fallar — la cadena aparece en dos docblocks. Un gate que no puede encenderse es
      # un adorno, y los adornos ensenian a ignorar los gates de al lado.
      - name: aceptacion de S6 (reserva -> vidriera -> cron, medido de una corrida)
        if: always()
        run: ./scripts/accept-s6.sh

      # `test-results/`, no `playwright-report/`: el config no tiene reporter `html`, tiene
      # `list` + el censo de specs. Lo unico que queda en disco tras una falla son los traces de
      # `trace: 'retain-on-failure'`, y van a `e2e/test-results/`. La ruta anterior
      # (`apps/web/playwright-report/`) no existio nunca: el paso subia cero bytes y avisaba en un
      # warning que nadie lee.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
