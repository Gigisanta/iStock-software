name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mismo shim que scripts/pg-local.sh levanta en la maquina del dev: roles anon/authenticated/
  # service_role y un schema auth cuyo auth.jwt() tiene el MISMO cuerpo que el de Supabase.
  # Los tests de RLS cruzado NO se saltean en CI: si se saltearan, "A no lee B" seria una promesa.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/istock_dev
  ISTOCK_DB: istock_dev
  PGHOST: localhost
  PGUSER: postgres
  PGPASSWORD: postgres

jobs:
  build:
    name: typecheck · lint · test · rls
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.34.5 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Bloqueante por constitucion (CLAUDE.md §3): CVE-2026-64648 no tiene workaround, solo
      # upgrade, asi que una vulnerabilidad high o critical no entra a main.
      - name: audit
        run: pnpm audit --audit-level=high

      - name: typecheck
        run: pnpm -r typecheck

      - name: lint
        run: pnpm -r lint

      - name: base de datos
        run: ./scripts/pg-local.sh

      - name: migraciones
        run: pnpm --filter @istock/db migrate

      - name: seed
        run: pnpm --filter @istock/db seed

      - name: tests (incluye RLS cruzado contra Postgres real)
        run: pnpm -r test

      # Los gates que la constitucion pide y que ningun linter da gratis: si estos encuentran
      # algo, es una fuga a la vidriera, no un warning de estilo.
      #
      # Los cuatro corren SIEMPRE y por separado, no encadenados con `&&`: encadenarlos hace que
      # el primer rojo tape a los otros tres y que el reporte de CI diga una sola cosa cuando
      # pasaron cuatro. `if: always()` cuesta segundos y compra el diagnostico completo.
      # Los helpers compartidos de los gates, en las dos polaridades. Es la contrapartida de haber
      # centralizado en `scripts/_lib.sh` (T4): si un cambio aca rompiera `none()`/`noneraw()`, TODOS
      # los gates se volverian vacuamente verdes a la vez, que es el unico riesgo real de compartir.
      - name: polaridad de los helpers de los gates
        run: ./scripts/_lib.test.sh

      - name: gate de datos sensibles
        run: ./scripts/guard-leaks.sh

      # Agregados por el LEAD el 2026-08-28. guard-grants existia desde el mismo dia pero SOLO
      # corria dentro de accept-s1.sh, que no esta en CI: o sea que la unica auditoria de los
      # GRANT del repo no se ejecutaba en ningun push. Un gate que no corre es un archivo.
      - name: gate de GRANT por sentencia (CLAUDE.md §2)
        if: always()
        run: ./scripts/guard-grants.sh

      - name: gate de R2 (master privado, key no derivable, cero delete por key)
        if: always()
        run: ./scripts/guard-r2.sh

      - name: phantom-file guard (artefacto inexistente o vacio = la tarea no paso)
        if: always()
        run: ./scripts/guard-artifacts.sh --harness

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/pg-local.sh && pnpm --filter @istock/db migrate && pnpm --filter @istock/db seed

      # `@istock/e2e`, NO `@istock/web`. La suite vive en `e2e/`, con su `playwright.config.ts` y su
      # devDependency de `@playwright/test`. `apps/web` no tiene ninguna de las dos cosas: hasta el
      # 2026-08-28 estas dos lineas decian `@istock/web` y el resultado era
      # `Total: 0 tests in 0 files`, exit 0. CI reportaba e2e verde sin haber corrido un solo test.
      - name: playwright
        run: pnpm --filter @istock/e2e exec playwright install --with-deps chromium

      # Los e2e que necesitan un secret humano (R2 real, MP sandbox, LLM) se marcan skip CON MOTIVO
      # en el propio test. Un e2e verde por no haber corrido es peor que un e2e rojo.
      - name: e2e
        run: pnpm --filter @istock/e2e e2e
        env:
          MEDIA_DRIVER: local
          BILLING_DRIVER: mock

      # El `.next` lo dejo el `webServer` del config de Playwright (buildea antes de levantar).
      # Este guard no buildea: lee ese manifest. Es el unico job que puede correrlo.
      - name: modo de servido de las rutas
        if: always()
        run: ./scripts/guard-routes.sh

      # `test-results/`, no `playwright-report/`: el config no tiene reporter `html`, tiene
      # `list` + el censo de specs. Lo unico que queda en disco tras una falla son los traces de
      # `trace: 'retain-on-failure'`, y van a `e2e/test-results/`. La ruta anterior
      # (`apps/web/playwright-report/`) no existio nunca: el paso subia cero bytes y avisaba en un
      # warning que nadie lee.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
